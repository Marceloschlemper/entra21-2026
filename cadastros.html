<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastros</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container{
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

       #listaClientes{

         display: grid;
         grid-template-columns: repeat(3, 1fr);
         gap: 20px;

}
        .card{

            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            min-height: 220px;

            display: flex;
            flex-direction: column;
}

        .card h3{

            margin-top: 0;
            color: rgb(35, 56, 241);

        }

        .excluir{

            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            border: none;
             border-radius: 5px;
             width: 30px;
             height: 30px;
              cursor: pointer;

        }

        button{
            margin-top: 20px;
            padding: 10px;
            border: none;
            background-color: #2d89ef;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

      .editar{

    margin-top: 8px;
    background-color: #c95f09;
    color: white;
    border: none;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: auto;

       }

     .email{

    min-height: 45px;

        }
    </style>

</head>

<body>

    <div class="container">

        <h2>Clientes Cadastrados</h2>

        <div id="listaClientes"></div>

        <button onclick="voltar()">
            voltar ao cadastro
        </button>

    </div>

    <script>
        const lista =
    document.getElementById('listaClientes');

let pessoas =
    JSON.parse(localStorage.getItem('clientes'))
    || [];



function mostrarClientes(){

    lista.innerHTML = '';

    pessoas.forEach((pessoa, indice) => {

        lista.innerHTML += `
        
            <div class="card">

                <button
                    class="excluir"
                    onclick="excluirCliente(${indice})"
                >
                    X
                </button>

                <h3>${pessoa.nome}</h3>

               <p class="email">
                    <strong>Email:</strong>
                    ${pessoa.email}
               </p>

                <p>
                    <strong>Telefone:</strong>
                    ${pessoa.telefone}
                </p>

                 <button
                    class="editar"
                    onclick="editarCliente(${indice})"
                 >
                    Editar
                </button>


            </div>

        `;

    });

}



function excluirCliente(indice){

    pessoas.splice(indice, 1);

    localStorage.setItem(
        'clientes',
        JSON.stringify(pessoas)
    );

    mostrarClientes();

}

//função editar

function editarCliente(indice){

    const novoNome = prompt(
        'novo nome:',
        pessoas[indice].nome
    );

    const novoEmail = prompt(
        'novo email:',
        pessoas[indice].email
    );

    const novoTelefone = prompt(
        'novo telefone:',
        pessoas[indice].telefone
    );


    if(
        novoNome === null ||
        novoEmail === null ||
        novoTelefone === null
    ){
        return;
    }


    pessoas[indice] = {

        nome: novoNome,

        email: novoEmail,

        telefone: novoTelefone

    };


    localStorage.setItem(
        'clientes',
        JSON.stringify(pessoas)
    );


    mostrarClientes();

}

mostrarClientes();

    




function voltar(){

    window.location.href =
        'index.html';

}



mostrarClientes();
    </script>

</body>
</html>
