<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f1f3f4;;
            font-family: arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        .card { 
            width:350px;
            border-radius: 14px;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 6px 20px rgba(0,0,0,0.20);
            margin: 20px;
            transition: all 0.2 ease;
            cursor: pointer;
            
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.20);
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .card-content {
            padding: 16px;

        }

        .fonte {
            font-size: 12px;
            color: #777;
            margin-bottom: 6px;
        }
        
        .card h3 {
            font-size: 16px;
            margin: 6px 0 10px;
            line-height: 1.4;
        }

        .interaçoes {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #555;
        }
        
        

    </style>
</head>
<body>
  
    <div class="card">
        <img src="https://www.365scores.com/pt-br/news/magazine/wp-content/uploads/2025/07/psg-bayern-1536x864.jpg" alt="maçãs">
        <div class="card-content">
            <span class="fonte">Noticias mundo do futebol ° hoje </span>

            <h3>veja as escalaçoes para bayern de munique x paris saint germain:</h3>

            <div class="interaçoes">
                <span> 2,5k❤️</span>
                <span> 560💬</span>
                <span> 323🔁</span>
                <div>
            </div>
        </div>
        
    
</body>
</html>
