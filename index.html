<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
    background-color: white;
    padding: 20px;
    border-radius: 10px;
}

h2,
h3 {
    text-align: center;
}

.formulario {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: #2d89ef;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: rgb(104, 104, 248);
}

table {
    border-collapse: collapse;
    background-color: white;
}

th,
td {
    padding: 10px;
    text-align: center;
}

th {
    background-color: rgb(16, 16, 248);
    color: white;
}
    </style>

  

    <div class="container">

        <h2>Cadastro de Clientes</h2>

        <div class="formulario">

            <input type="text" id="nome" placeholder="Nome">

            <input type="email" id="email" placeholder="Email">

            <input type="tel" id="telefone" placeholder="Telefone">

            <button id="cadastrar">
                Cadastrar
            </button>

            <button id="salvos">
                mostrar cadastros
            </button>

            <button id="limparTabela">
                Limpar tabela
            </button>

            <button id="limparCadastros">
                Limpar cadastros
            </button>
            

        </div>

        <h3>Lista de Clientes</h3>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Telefone</th>
                </tr>
            </thead>

            <tbody id="tabelaClientes">
            </tbody>
        </table>

    </div>

   

    <script src="script.js"></script>

</body>
</html>
