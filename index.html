<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container{
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2{
            text-align: center;
        }

        .formulario{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .botao-cadastrar{
            background-color: #2d89ef;
        }

        .botao-cadastrar:hover{
            background-color: #1c6fd1;
        }

        .botao-limpar{
            background-color: rgb(10, 2, 2);
        }

        .botao-limpar:hover{
            background-color: rgb(32, 31, 31);
        }

        .botao-link{
            background: none;
            border: none;
            color: rgb(2, 122, 18);
            font-size: 16px;
            cursor: pointer;
            padding: 0;
            display: block;
            margin-right: auto;
        }

        .botao-link:hover{
            background: none;
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Cadastro de Clientes</h2>

        <div class="formulario">

            <input type="text" id="nome" placeholder="Nome">

            <input type="email" id="email" placeholder="Email">

            <input type="tel" id="telefone" placeholder="Telefone">

            <button id="cadastrar" class="botao-cadastrar">
                Cadastrar
            </button>

            <button id="limparCadastros" class="botao-limpar">
                Limpar todos os cadastros
            </button>

            <button id="salvos" class="botao-link">
                Mostrar cadastros
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
